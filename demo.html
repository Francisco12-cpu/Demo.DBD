<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Assassino vs Sobreviventes — Demo</title>
<style>
  :root{
    --bg-deep: #0c0a10;
    --bg-floor: #17131d;
    --wall: #2a2233;
    --blood: #8c1f28;
    --gold: #c9a24b;
    --survivor: #3f8f6f;
    --killer: #7a1f2b;
    --ink: #ece6da;
    --muted: #8a8092;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  #arena{
    position:relative;
    background: var(--bg-floor);
    border: 3px solid var(--wall);
    box-shadow: 0 0 0 8px var(--bg-deep), 0 0 40px rgba(0,0,0,.6) inset;
    background-image:
      linear-gradient(var(--wall) 1px, transparent 1px),
      linear-gradient(90deg, var(--wall) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
  }
  #hud{
    position:absolute; top:16px; left:16px; right:16px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    letter-spacing: 1px;
  }
  #title{
    font-size: 12px; color: var(--muted); text-transform:uppercase;
  }
  #title b{ color: var(--gold); display:block; font-size:16px; letter-spacing:2px;}
  #panel{
    background: rgba(12,10,16,.85);
    border: 1px solid var(--wall);
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.6;
    pointer-events:all;
  }
  #panel b{ color: var(--gold); }
  #panel .row{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  #panel button{
    background: var(--wall); color: var(--ink); border: 1px solid var(--muted);
    font-family: inherit; font-size: 11px; padding: 4px 8px; cursor:pointer;
  }
  #panel button.active{ background: var(--gold); color: #1a1420; border-color: var(--gold);}
  #panel input[type=range]{ width: 90px; vertical-align: middle; }
  .char{
    position:absolute;
    width:42px; height:42px;
    left:0; top:0;
    transform: translate(-50%,-50%);
    transition: none;
  }
  .body{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .torso{
    width:26px; height:34px;
    border-radius: 8px 8px 4px 4px;
    position:relative;
    box-shadow: 0 3px 6px rgba(0,0,0,.5);
  }
  .face{
    position:absolute; top:2px; left:50%;
    width:10px; height:10px;
    background: #1a1420;
    border-radius:50%;
    transform: translateX(-50%);
  }
  .weapon{
    position:absolute;
    width: 22px; height: 4px;
    background: var(--gold);
    top: 12px; right: -14px;
    border-radius: 2px;
    transform-origin: left center;
    opacity: 0;
  }
  .char.facing-left .weapon{ right:auto; left:-14px; transform-origin: right center; transform: scaleX(-1); }
  .char.attacking .weapon{ opacity:1; animation: swing .35s ease-out; }
  @keyframes swing{
    0%{ transform: rotate(-70deg); opacity:1;}
    60%{ transform: rotate(25deg); }
    100%{ transform: rotate(0deg); opacity:0;}
  }
  .char.facing-left.attacking .weapon{ animation: swingL .35s ease-out; }
  @keyframes swingL{
    0%{ transform: scaleX(-1) rotate(-70deg); opacity:1;}
    60%{ transform: scaleX(-1) rotate(25deg); }
    100%{ transform: scaleX(-1) rotate(0deg); opacity:0;}
  }
  .char.running .torso{ animation: bob .28s infinite ease-in-out; }
  @keyframes bob{
    0%,100%{ transform: translateY(0) scaleY(1); }
    50%{ transform: translateY(-3px) scaleY(1.04); }
  }
  .char.facing-left .body{ transform: scaleX(-1); }
  .shadow{
    position:absolute; bottom:-6px; left:50%;
    width:26px; height:8px;
    background: rgba(0,0,0,.5);
    border-radius:50%;
    transform: translateX(-50%);
    filter: blur(1px);
  }
  .label{
    position:absolute; bottom:-22px; left:50%; transform:translateX(-50%);
    font-size:9px; color:var(--muted); white-space:nowrap; text-transform:uppercase; letter-spacing:1px;
  }
  #dummy{
    position:absolute;
    width:30px; height:38px;
    background: var(--wall);
    border: 1px solid var(--muted);
    border-radius: 6px;
  }
  #dummy .hp-bar{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:34px; height:5px; background:#1a1420; border:1px solid var(--wall);
  }
  #dummy .hp-fill{
    height:100%; background: var(--blood); width:100%;
    transition: width .15s ease-out;
  }
  #hint{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    font-size:11px; color: var(--muted); text-align:center;
    background: rgba(12,10,16,.85);
    border: 1px solid var(--wall);
    padding: 8px 14px;
    letter-spacing: 0.5px;
  }
  #hint b{ color: var(--gold); }
</style>
</head>
<body>

<div id="stage">
  <div id="arena">
    <div id="hud">
      <div id="title"><b>Assassino vs Sobreviventes</b>protótipo de movimento — arena de teste</div>
      <div id="panel">
        <div><b>Configurar personagem</b></div>
        <div class="row">
          <span>Tipo:</span>
          <button id="btn-survivor" class="active">Sobrevivente</button>
          <button id="btn-killer">Assassino</button>
        </div>
        <div class="row">
          <span>Velocidade:</span>
          <input id="speed" type="range" min="60" max="360" value="180">
          <span id="speed-val">180</span>
        </div>
        <div class="row">
          <span>Dano do ataque:</span>
          <input id="damage" type="range" min="5" max="100" value="25">
          <span id="damage-val">25</span>
        </div>
      </div>
    </div>

    <div id="dummy">
      <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
    </div>

    <div class="char" id="player">
      <div class="shadow"></div>
      <div class="body">
        <div class="torso" id="torso">
          <div class="face"></div>
        </div>
        <div class="weapon"></div>
      </div>
      <div class="label" id="player-label">SOBREVIVENTE</div>
    </div>
  </div>

  <div id="hint">
    Mova com <b>WASD</b> ou <b>setas</b> · Ataque com <b>ESPAÇO</b> · Troque o tipo e a velocidade no painel acima
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- CONFIG (equivalente às @export do Godot) ----------
  const config = {
    speedSurvivor: 180,
    speedKiller: 220,
    attackDamage: 25,
    attackCooldown: 600,   // ms
    attackDuration: 350,   // ms
    attackRange: 55,       // px
  };

  const characterColors = {
    survivor: getComputedStyle(document.documentElement).getPropertyValue('--survivor').trim(),
    killer: getComputedStyle(document.documentElement).getPropertyValue('--killer').trim(),
  };

  // ---------- ESTADO ----------
  const arena = document.getElementById('arena');
  const player = document.getElementById('player');
  const torso = document.getElementById('torso');
  const label = document.getElementById('player-label');
  const dummy = document.getElementById('dummy');
  const hpFill = document.getElementById('hp-fill');

  let characterType = 'survivor'; // 'survivor' | 'killer'
  let pos = { x: 0, y: 0 };
  let facingRight = true;
  let isAttacking = false;
  let canAttack = true;
  let dummyHp = 100;
  const dummyMaxHp = 100;

  const keys = {};

  function resizeArena(){
    const w = Math.min(window.innerWidth - 40, 900);
    const h = Math.min(window.innerHeight - 120, 560);
    arena.style.width = w + 'px';
    arena.style.height = h + 'px';
    pos.x = w / 2;
    pos.y = h / 2;
    dummy.style.left = (w * 0.75) + 'px';
    dummy.style.top = (h * 0.5) + 'px';
    dummy.style.transform = 'translate(-50%,-50%)';
  }

  function currentSpeed(){
    return characterType === 'killer' ? config.speedKiller : config.speedSurvivor;
  }

  function applyCharacterVisuals(){
    torso.style.background = characterColors[characterType];
    label.textContent = characterType === 'killer' ? 'ASSASSINO' : 'SOBREVIVENTE';
  }

  // ---------- INPUT ----------
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space') {
      e.preventDefault();
      tryAttack();
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  function isDown(...codes){
    return codes.some(c => keys[c]);
  }

  // ---------- ATAQUE ----------
  function tryAttack(){
    if (!canAttack || isAttacking) return;

    isAttacking = true;
    canAttack = false;
    player.classList.add('attacking');

    // checa se o boneco de treino está no alcance, na direção que o player olha
    const dx = (parseFloat(dummy.style.left) - pos.x);
    const dy = (parseFloat(dummy.style.top) - pos.y);
    const dist = Math.hypot(dx, dy);
    const facingMatches = (facingRight && dx > -10) || (!facingRight && dx < 10);

    if (dist <= config.attackRange && facingMatches) {
      dummyHp = Math.max(0, dummyHp - config.attackDamage);
      hpFill.style.width = (dummyHp / dummyMaxHp * 100) + '%';
      dummy.style.filter = 'brightness(2)';
      setTimeout(() => dummy.style.filter = '', 100);
      if (dummyHp === 0) {
        setTimeout(() => {
          dummyHp = dummyMaxHp;
          hpFill.style.width = '100%';
        }, 400);
      }
    }

    setTimeout(() => {
      isAttacking = false;
      player.classList.remove('attacking');
    }, config.attackDuration);

    setTimeout(() => {
      canAttack = true;
    }, config.attackCooldown);
  }

  // ---------- LOOP PRINCIPAL ----------
  let lastTime = performance.now();

  function loop(now){
    const delta = (now - lastTime) / 1000;
    lastTime = now;

    if (!isAttacking){
      let dx = 0, dy = 0;
      if (isDown('KeyA','ArrowLeft')) dx -= 1;
      if (isDown('KeyD','ArrowRight')) dx += 1;
      if (isDown('KeyW','ArrowUp')) dy -= 1;
      if (isDown('KeyS','ArrowDown')) dy += 1;

      const moving = dx !== 0 || dy !== 0;

      if (moving){
        const len = Math.hypot(dx, dy);
        dx /= len; dy /= len;

        const speed = currentSpeed();
        pos.x += dx * speed * delta;
        pos.y += dy * speed * delta;

        const bounds = arena.getBoundingClientRect();
        pos.x = Math.max(21, Math.min(bounds.width - 21, pos.x));
        pos.y = Math.max(21, Math.min(bounds.height - 21, pos.y));

        if (dx > 0) facingRight = true;
        if (dx < 0) facingRight = false;

        player.classList.add('running');
      } else {
        player.classList.remove('running');
      }

      player.classList.toggle('facing-left', !facingRight);
    }

    player.style.left = pos.x + 'px';
    player.style.top = pos.y + 'px';

    requestAnimationFrame(loop);
  }

  // ---------- PAINEL DE CONFIGURAÇÃO ----------
  const btnSurvivor = document.getElementById('btn-survivor');
  const btnKiller = document.getElementById('btn-killer');
  const speedSlider = document.getElementById('speed');
  const speedVal = document.getElementById('speed-val');
  const damageSlider = document.getElementById('damage');
  const damageVal = document.getElementById('damage-val');

  btnSurvivor.addEventListener('click', () => {
    characterType = 'survivor';
    btnSurvivor.classList.add('active');
    btnKiller.classList.remove('active');
    speedSlider.value = config.speedSurvivor;
    speedVal.textContent = config.speedSurvivor;
    applyCharacterVisuals();
  });

  btnKiller.addEventListener('click', () => {
    characterType = 'killer';
    btnKiller.classList.add('active');
    btnSurvivor.classList.remove('active');
    speedSlider.value = config.speedKiller;
    speedVal.textContent = config.speedKiller;
    applyCharacterVisuals();
  });

  speedSlider.addEventListener('input', () => {
    const v = parseInt(speedSlider.value, 10);
    speedVal.textContent = v;
    if (characterType === 'killer') config.speedKiller = v;
    else config.speedSurvivor = v;
  });

  damageSlider.addEventListener('input', () => {
    const v = parseInt(damageSlider.value, 10);
    damageVal.textContent = v;
    config.attackDamage = v;
  });

  // ---------- INIT ----------
  window.addEventListener('resize', resizeArena);
  resizeArena();
  applyCharacterVisuals();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
